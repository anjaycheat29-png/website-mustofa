
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUSTOFA WEB</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: white;
      background: #080808;
    }
    main {
      width: 100%;
      max-width: 440px;
      padding: 32px 24px;
      text-align: center;
      border: 1px solid #393027;
      border-radius: 20px;
      background: #151515;
    }
    h1 { color: #ff8800; }
    p { color: #c8c8c8; line-height: 1.6; }
    button {
      padding: 12px 20px;
      color: #111;
      background: #ff8800;
      border: 0;
      border-radius: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <h1>MUSTOFA WEB</h1>
    <p>Website pertama gw berhasil online!</p>
    <button onclick="sapa()">Tes JavaScript</button>
    <p id="hasil"></p>
  </main>
  <script>
    function sapa() {
      document.getElementById("hasil").textContent =
        "JavaScript berhasil dijalankan!";
    }
  </script>
</body>
</html>
